{% extends "base.html" %}
{% block body_class %}page-auth{% endblock %}
{% block body %}
<div class="auth">
  <main id="main" class="auth__panel">
    <a class="brand auth__brand" href="{{ url_for('public.index') }}">
      <img class="brand__mark" src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="" width="28" height="28">
      <span class="brand__name">{{ APP_NAME }}</span>
    </a>
    <div class="auth__body">
      {{ flashes() }}
      {% block content %}{% endblock %}
    </div>
    <p class="auth__footer muted">
      <a href="{{ url_for('public.privacy') }}">Privacy</a> · <a href="{{ url_for('public.terms') }}">Terms</a>
    </p>
  </main>
  <aside class="auth__aside" aria-hidden="true">
    {% block aside %}{% endblock %}
  </aside>
</div>
{% endblock %}

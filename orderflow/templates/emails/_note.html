{#- A quoted note (order notes, a reason, an enquiry). Expects `note`. -#}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:16px 0 0;">
  <tr>
    <td bgcolor="#f5f6fb" style="background-color:#f5f6fb;border-left:3px solid #c9cee0;border-radius:0 8px 8px 0;padding:12px 14px;font-size:14px;line-height:1.55;color:#343b5e;white-space:pre-line;">{{ note }}</td>
  </tr>
</table>

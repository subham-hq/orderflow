<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f9;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#141936;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f9;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
      <tr><td style="padding:0 4px 20px;font-size:18px;font-weight:700;letter-spacing:-0.01em;color:#1b2a6b;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#f2a93b;margin-right:8px;vertical-align:1px;"></span>{{ app_name }}
      </td></tr>
      <tr><td style="background:#ffffff;border:1px solid #e3e5f0;border-radius:14px;padding:32px 28px;">
        {% block content %}{% endblock %}
      </td></tr>
      <tr><td style="padding:20px 4px 0;font-size:12px;line-height:1.6;color:#6b7194;">
        {% block footer %}You're receiving this because of your account on {{ app_name }}.{% endblock %}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>

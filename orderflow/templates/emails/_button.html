{#- Call-to-action button with the plain link underneath. Expects `link` and `label`. -#}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 20px;">
  <tr>
    <td align="center" bgcolor="#1b2a6b" style="background-color:#1b2a6b;border-radius:8px;">
      <a href="{{ link }}" target="_blank" style="display:inline-block;padding:13px 22px;font-size:15px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 4px;font-size:12px;line-height:1.5;color:#5a6182;">If the button doesn't work, paste this link into your browser:</p>
<p style="margin:0;font-size:12px;line-height:1.5;word-break:break-all;"><a href="{{ link }}" target="_blank" style="color:#3044b0;">{{ link }}</a></p>

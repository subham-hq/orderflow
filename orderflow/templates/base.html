{% from "macros/ui.html" import icon, flashes %}
<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}{% if self.title() != APP_NAME %} · {{ APP_NAME }}{% endif %}</title>
  <meta name="description" content="{% block description %}OrderFlow is B2B ordering for suppliers: share your catalog, take purchase orders from business clients, approve them and send GST-ready proforma invoices.{% endblock %}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f24" media="(prefers-color-scheme: dark)">
  {% block meta %}{% endblock %}
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='img/icon-192.png') }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=APP_VERSION) }}">
  <script src="{{ url_for('static', filename='js/app.js', v=APP_VERSION) }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>

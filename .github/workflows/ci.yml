name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you start a run from the Actions tab ("Run workflow")
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=orderflow --cov-report=term --cov-fail-under=90

  test-postgres:
    name: Tests and migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow
          POSTGRES_DB: orderflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret
      FLASK_APP: wsgi.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests against Postgres
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://orderflow:orderflow@localhost:5432/orderflow
      - name: Migrations upgrade, match the models, and downgrade cleanly
        env:
          DATABASE_URL: postgres://orderflow:orderflow@localhost:5432/orderflow
        run: |
          psql "postgresql://orderflow:orderflow@localhost:5432/orderflow" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          flask db upgrade
          flask db check
          flask seed-demo
          flask db downgrade base
          flask db upgrade
